version: 2

# A tool that reports outdated dependencies to other people should not be
# running on stale ones itself. Grouped and monthly rather than per-dependency
# and weekly: a queue of single-line bumps nobody reads is how a real advisory
# gets skimmed past.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    # wasmtime stays on the patched 36.x line until a newer major has no open
    # advisories. The floor in Cargo.toml moves by hand, once `cargo deny check`
    # is clean on the new version. Left to itself, Dependabot proposes a major
    # that check rejects, and since the rust group is one PR, that one bump
    # holds back every safe update batched with it. 36.x patches still arrive.
    ignore:
      - dependency-name: wasmtime
        update-types: ["version-update:semver-major"]
    groups:
      # oxc is pinned exactly on purpose (ADR 0005) — its AST is a
      # pre-1.0 API and a patch bump has broken visitors before. Kept in its
      # own group so the bump is reviewed rather than batched in with the rest.
      oxc:
        patterns: ["oxc*"]
      rust:
        patterns: ["*"]
        exclude-patterns: ["oxc*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
