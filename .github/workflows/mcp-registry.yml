# Lists the released version on the official MCP registry.
#
# The registry proves ownership by reading `mcpName` out of the *published* npm
# package, so this cannot run before npm does. It signs in with GitHub's OIDC
# token, which grants the `io.github.<owner>` namespace: there is no secret to
# store, and nothing to expire between releases.
#
# The Release workflow calls it after a publish. Run it by hand when a release
# reached npm and the listing did not: `gh workflow run mcp-registry.yml`.
name: MCP registry

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-registry
  cancel-in-progress: false

env:
  # Pinned by digest, not by tag. This binary runs with an OIDC token in reach,
  # so moving it is a reviewed change to both lines.
  PUBLISHER_VERSION: v1.8.8
  PUBLISHER_SHA256: 09f1fa70ee146b640584274a1a6b2b8a0310b05d4321fa9224e6df6a016d67f4

jobs:
  publish:
    name: publish to the MCP registry
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: the descriptor agrees with the manifests
        run: node scripts/check-version.mjs

      # npm accepts a publish some minutes before it serves it, and not every
      # package at once: 1.3.1's CLI was installable minutes before its
      # linux-x64 and darwin-arm64 binaries were. A host that starts the server
      # in between gets "could not load the owlwarden engine".
      - name: npm serves every package
        shell: bash
        run: |
          set -euo pipefail
          version=$(jq -r .version mcp/server.json)
          name=$(jq -r .name mcp/server.json)
          npm=https://registry.npmjs.org

          ready() {
            local cli native pkg
            cli=$(curl -fsS "$npm/owlwarden/$version") || return 1
            [ "$(jq -r .mcpName <<< "$cli")" = "$name" ] || return 1
            native=$(curl -fsS "$npm/@dointhai%2fowlwarden-core-native/$version") || return 1
            for pkg in $(jq -r '.optionalDependencies | keys[]' <<< "$native"); do
              curl -fsS -o /dev/null "$npm/${pkg/\//%2f}/$version" || return 1
            done
          }

          for _ in $(seq 1 60); do
            if ready 2> /dev/null; then
              echo "npm serves owlwarden $version as $name"
              exit 0
            fi
            sleep 20
          done
          echo "::error::npm does not serve every package of owlwarden $version as $name"
          exit 1

      - name: install the publisher
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/publisher"
          cd "$RUNNER_TEMP/publisher"
          archive=mcp-publisher_linux_amd64.tar.gz
          curl -fsSL -o "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/$PUBLISHER_VERSION/$archive"
          echo "$PUBLISHER_SHA256  $archive" | sha256sum --check --strict
          tar xzf "$archive" mcp-publisher

      # A version can be published once. Finding it already there is a rerun,
      # not a failure.
      - name: publish
        shell: bash
        run: |
          set -euo pipefail
          version=$(jq -r .version mcp/server.json)
          name=$(jq -r '.name | @uri' mcp/server.json)
          listing="https://registry.modelcontextprotocol.io/v0.1/servers/$name/versions/$version"
          if curl -fsS -o /dev/null "$listing" 2> /dev/null; then
            echo "already listed: $listing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          publisher="$RUNNER_TEMP/publisher/mcp-publisher"
          "$publisher" login github-oidc
          "$publisher" publish mcp/server.json
          curl -fsS --retry 5 --retry-all-errors --retry-delay 5 -o /dev/null "$listing"
          echo "listed: $listing" >> "$GITHUB_STEP_SUMMARY"
